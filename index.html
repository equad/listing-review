<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Listing Review</title>
<style>
:root{
  --bg:#F4F5F7; --ink:#1B1E22; --mut:#5B636D; --card:#FFFFFF; --line:#DDE1E6;
  --accent:#2F6B8F; --ok:#1E7B45; --warn:#9A6700; --bad:#B3261E;
  --chip-ok:#E3F2E9; --chip-warn:#FBF0DA; --chip-bad:#FBE3E1; --mono-bg:#F0F2F4;
  --az-ink:#0F1111; --az-link:#007185; --az-price:#B12704; --az-line:#E7E7E7;
  --ans:#6B4FAE; --chip-ans:#ECE5F7; --chip-acc:#E3EDF4;
  --st-live:#00C853; --st-warn:#FFAB00; --st-bad:#FF3B30; --st-ready:#2E9BFF; --st-ans:#A868FF;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181B; --ink:#E6E8EB; --mut:#9AA3AD; --card:#1F2226;
    --line:#33383E; --accent:#6FA8CC; --ok:#57B380; --warn:#D9A03F; --bad:#E58B84;
    --chip-ok:#20372B; --chip-warn:#3A3021; --chip-bad:#3D2523; --mono-bg:#26292E;
    --ans:#A98FE0; --chip-ans:#332A45; --chip-acc:#23303B;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);
  background:var(--card);position:sticky;top:0;z-index:5;flex-wrap:wrap}
h1{font-size:16.5px;margin:0;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:12.5px}
.spacer{flex:1}
.count{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--mono-bg);color:var(--mut)}
.count.ok{background:var(--chip-ok);color:var(--ok)}
.count.warn{background:var(--chip-warn);color:var(--warn)}
.count.acc{background:var(--chip-acc);color:var(--accent)}
.count.bad{background:var(--chip-bad);color:var(--bad)}
button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 13px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.approve{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
button.golive{background:var(--warn);border-color:var(--warn);color:#fff;font-weight:700}
button.ghost{background:transparent}
button:disabled{opacity:.5;cursor:default}
.layout{display:flex;flex:1;min-height:0}
nav{width:295px;min-width:295px;overflow-y:auto;border-right:1px solid var(--line);background:var(--card);padding:8px 0 30px}
.navgroup{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700;padding:14px 16px 5px}
.navitem{display:flex;gap:9px;align-items:center;padding:7px 16px;cursor:pointer;border-left:3px solid transparent}
.navitem:hover{background:var(--mono-bg)}
.navitem.sel{border-left-color:var(--accent);background:var(--mono-bg)}
.navitem .dot{width:14px;height:14px;border-radius:99px;background:var(--line);flex:none}
.navitem.st-revising .dot,.navitem.st-launching .dot,.navitem.st-validating .dot{background:var(--st-warn);box-shadow:0 0 8px var(--st-warn);animation:pulse 1.2s infinite}
.navitem.st-revised .dot{background:var(--st-warn);box-shadow:0 0 8px var(--st-warn)}
.navitem.st-needs_info .dot{background:var(--st-bad);box-shadow:0 0 8px var(--st-bad)}
.navitem.st-ready .dot{background:var(--st-ready);box-shadow:0 0 8px var(--st-ready)}
.navitem.st-live .dot{background:var(--st-live);box-shadow:0 0 8px var(--st-live)}
.navitem.st-skipped{opacity:.5}
.navitem.st-skipped .dot{background:var(--mut)}
.navitem.st-answered .dot{background:var(--st-ans);box-shadow:0 0 8px var(--st-ans)}
@keyframes pulse{50%{opacity:.35}}
.navitem .nm{font-size:13px;line-height:1.3;flex:1}
.navitem .pr{font-size:11.5px;color:var(--mut)}
main{flex:1;overflow-y:auto;padding:20px 22px 80px}
.wrap{max-width:1120px;margin:0 auto}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.flag{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px}
.flag.warn{background:var(--chip-warn);color:var(--warn)}
.flag.bad{background:var(--chip-bad);color:var(--bad)}
.flag.ok{background:var(--chip-ok);color:var(--ok)}
.flag.info{background:var(--mono-bg);color:var(--mut)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}
.meta>div{background:var(--card);padding:3px 9px}
.meta .k{font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);font-weight:700}
.meta .v{font-size:12px;word-break:break-all}
.meta a{color:var(--accent);text-decoration:none}
.mock{background:#fff;color:var(--az-ink);border:1px solid var(--line);border-radius:10px;
  padding:24px 24px 28px;font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;margin-bottom:16px}
.mock.flash{animation:flash 1.2s}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--warn)}100%{box-shadow:none}}
.mock-tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);
  margin:0 0 14px;font-family:system-ui,sans-serif;font-weight:600}
.cols{display:grid;grid-template-columns:minmax(240px,330px) minmax(300px,1fr) 225px;gap:24px}
@media(max-width:980px){.cols{grid-template-columns:1fr}}
.gallery{display:flex;gap:10px;align-items:flex-start}
.thumbcol{display:flex;flex-direction:column;gap:8px}
.thumb{width:46px;height:46px;padding:2px;border:1px solid #ccc;border-radius:5px;background:#fff;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb.sel{border:2px solid var(--az-link);box-shadow:0 0 0 2px #C8E4EC}
.thumbwrap{display:flex;flex-direction:column;align-items:center}
.thumbops{display:flex;gap:2px;margin-top:2px}
.thumbops button{font-size:9px;line-height:14px;padding:0 4px;cursor:pointer;border:1px solid #ccc;border-radius:3px;background:#fff}
.thumbops button:disabled{opacity:.35;cursor:default}
.thumbadd{display:flex;align-items:center;justify-content:center;font-size:22px;color:#888;border-style:dashed}
.mainimg{flex:1;border:1px solid var(--az-line);border-radius:6px;background:#fff;
  display:flex;align-items:center;justify-content:center;min-height:300px}
.mainimg img{max-width:100%;max-height:420px;display:block}
.noimg{color:#999;font-size:13px;text-align:center;padding:40px 20px}
.ttl{font-size:19px;line-height:1.35;margin:0 0 2px;font-weight:400}
.byline{color:var(--az-link);font-size:13px;margin:2px 0 6px}
.stars{color:#c9c9c9;font-size:13px;letter-spacing:1px}
.stars span{color:var(--az-link);margin-left:6px;letter-spacing:0}
.rule{border:0;border-top:1px solid var(--az-line);margin:12px 0}
.hlx{font-size:13px;color:#565959;margin:6px 0 0;font-style:italic}
.varlab{font-size:13px;margin:12px 0 4px}
.chiprow{display:flex;gap:7px;flex-wrap:wrap}
.vchip{font-size:12px;border:1px solid #adb1b8;border-radius:6px;padding:5px 10px;cursor:pointer;background:#fff;color:var(--az-ink)}
.vchip.sel{border:2px solid var(--az-link);padding:4px 9px;background:#EDFDFF}
.vchip.pchip{border:1px dashed #adb1b8;font-weight:700;letter-spacing:.02em;color:var(--az-link)}
.vchip.pchip.sel{border:2px solid var(--az-link);background:#EDFDFF}
.vchip.unavail{border-style:dashed;opacity:.5}
.abt{font-size:14px;font-weight:700;margin:14px 0 0}
.mock ul{margin:8px 0 0;padding-left:18px}
.mock li{font-size:13.5px;line-height:1.45;margin-bottom:7px}
.buybox{border:1px solid var(--az-line);border-radius:8px;padding:16px;height:fit-content}
.price{font-size:25px;color:var(--az-price)}
.price sup{font-size:13px}
.bb-line{font-size:12.5px;color:#565959;margin-top:6px}
.bb-btn{display:block;width:100%;text-align:center;border-radius:99px;padding:7px 0;font-size:13px;margin-top:10px;border:none;cursor:default}
.bb-cart{background:#FFD814}
.bb-buy{background:#FFA41C}
.desc-h{font-size:15px;font-weight:700;margin:18px 0 6px;border-top:1px solid var(--az-line);padding-top:16px}
.desc{font-size:13.5px;line-height:1.55;max-width:900px;white-space:pre-line}
.panelrow{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:900px){.panelrow{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px 17px}
.panel h3{margin:0 0 9px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.kwbox{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--mono-bg);
  border-radius:7px;padding:9px 11px;word-break:break-word}
.factrow{display:flex;gap:10px;font-size:12.5px;padding:3px 0;border-bottom:1px dashed var(--line)}
.factrow:last-child{border-bottom:none}
.factrow .fk{color:var(--mut);min-width:110px;flex:none;text-transform:capitalize}
textarea,input[type=text],input[type=email]{width:100%;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;
  background:var(--bg);color:var(--ink);padding:8px 10px}
textarea{min-height:70px;resize:vertical}
.decide{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.notepill{font-size:12px;color:var(--warn);margin-top:8px}
.thread{display:flex;flex-direction:column;gap:8px;margin:10px 0;max-height:340px;overflow-y:auto}
.msg{max-width:82%;padding:8px 12px;border-radius:11px;font-size:13px;line-height:1.45;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--mono-bg);border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:none;color:var(--mut);font-size:12px;padding:2px}
.msg.ask{align-self:flex-start;max-width:92%;background:var(--chip-warn);border:1.5px solid var(--warn);border-bottom-left-radius:4px}
.msg.ask .who{color:var(--warn);font-weight:700;opacity:1}
.msg.ask b{display:block;margin-bottom:6px}
.askopt{display:block;width:100%;text-align:left;margin:4px 0;padding:7px 10px;border:1px solid var(--warn);border-radius:8px;background:var(--mono-bg);color:inherit;cursor:pointer;font-size:13px;font-weight:600}
.askopt:hover{filter:brightness(.96)}
.msg.ask .sub{margin-top:4px}
.ovrlab{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--warn);cursor:pointer;user-select:none}
.ovrrow{margin-top:6px}
.ovrrow input{width:100%;border-color:var(--warn)}
.msg.user.ovr{background:var(--warn)}
.msg .ovrtag{font-size:10.5px;font-weight:700;opacity:.85;margin-top:3px}
.msg .who{font-size:10.5px;opacity:.75;margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em}
.chatrow{display:flex;gap:8px;margin-top:8px}
.chatrow input{flex:1}
.statuschip{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;padding:6px 15px;border-radius:99px;background:var(--mono-bg);color:var(--mut)}
.statuschip.revising,.statuschip.launching,.statuschip.validating,.statuschip.revised{background:var(--st-warn);color:#fff}
.statuschip.needs_info{background:var(--st-bad);color:#fff}
.statuschip.ready{background:var(--st-ready);color:#fff}
.statuschip.live{background:var(--st-live);color:#fff}
.statuschip.skipped{background:var(--mono-bg);color:var(--mut)}
.statuschip.answered{background:var(--st-ans);color:#fff}
.topbar{position:sticky;top:-20px;z-index:4;background:var(--bg);padding-top:20px;margin-top:-20px;
  box-shadow:0 8px 10px -10px rgba(0,0,0,.25)}
.rfgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:0 0 4px}
.rfgrid>div{background:var(--card);padding:3px 9px}
.rfgrid .k{font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);font-weight:700}
.rfgrid .v{font-size:12px}
.rfgrid>div.missv{background:var(--chip-warn)}
.rfgrid>div.missv .v{color:var(--warn);font-weight:700}
.rfhint{font-size:10.5px;color:var(--mut);margin:0 0 6px}
.rfedit{border:none;background:none;color:var(--mut);cursor:pointer;font-size:11px;padding:0 2px;opacity:.55}
.rfedit:hover{opacity:1;color:var(--accent);border:none}
.vedit{display:flex;gap:4px;align-items:center;margin-top:2px}
.vedit input[type=text]{font-size:12.5px;padding:3px 6px;width:100%;min-width:70px}
.vedit input[type=checkbox]{width:15px;height:15px;accent-color:var(--warn)}
.ttl-edit input[type=text]{font-size:17px;padding:4px 7px}
.blt-edit{display:inline-flex;width:100%}
.blt-edit input[type=text]{font-size:13px}
.rfok,.rfx,.ttlok,.ttlx,.bltok,.bltx{border:1px solid var(--line);background:var(--card);cursor:pointer;border-radius:5px;font-size:12px;padding:2px 7px}
.rfok,.ttlok,.bltok{color:var(--ok);border-color:var(--ok)}
.rfx,.ttlx,.bltx{color:var(--mut)}
.spin{width:11px;height:11px;border:2px solid currentColor;border-top-color:transparent;border-radius:99px;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.uplbtn{display:inline-block;cursor:pointer;border:1px dashed #adb1b8;border-radius:8px;padding:8px 16px;font-size:13px;color:#0F1111;background:#FAFAFA}
/* login + campaigns */
.center{margin:auto;max-width:420px;width:100%;padding:20px}
.logincard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px}
.logincard h2{margin:0 0 6px;font-size:20px}
.logincard p{color:var(--mut);font-size:13.5px;margin:0 0 18px}
.campcard{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:18px 22px;margin-bottom:14px;cursor:pointer}
.campcard:hover{border-color:var(--accent)}
.cname{font-size:16.5px;font-weight:700}
.cdesc{color:var(--mut);font-size:13px;margin-top:3px}
.cstat{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cpill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
/* campaign picker: wide, multi-column grid + search */
#picker.center{max-width:1180px}
#camplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
#camplist .campcard{margin-bottom:0;height:100%}
.srchrow{display:flex;gap:10px;align-items:center;margin:0 0 14px}
.srchrow input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px}
#itemhits{margin:0 0 16px}
.hit{display:flex;gap:12px;align-items:baseline;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin-bottom:6px;cursor:pointer;font-size:13px}
.hit:hover{border-color:var(--accent)}
.hit .hc{color:var(--mut);font-size:12px;flex:none;min-width:150px}
.hit .ht{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit .hi{color:var(--mut);font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;flex:none}
.cpill.todo{background:var(--chip-warn);color:var(--warn)}
.cpill.live{background:var(--chip-ok);color:var(--ok)}
.cpill.skip{background:var(--mono-bg);color:var(--mut)}
.cpill.pend{background:var(--chip-acc);color:var(--accent)}
.cpill.err{background:var(--chip-bad);color:var(--bad)}
.cbar{margin-top:8px;height:6px;border-radius:99px;background:var(--mono-bg);overflow:hidden;display:flex}
.cbar .fill{background:var(--ok);height:100%}
.campcard{position:relative}
.campcard.archived{opacity:.45}
.campcard.archived:hover{opacity:.8}
.cacts{position:absolute;top:14px;right:16px;display:flex;gap:6px}
.cact{font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;border:1px solid var(--line);
  background:var(--mono-bg);color:var(--mut);cursor:pointer}
.cact:hover{border-color:var(--accent);color:var(--ink)}
.cact.del:hover{border-color:var(--st-bad);color:var(--st-bad)}
.importrow{display:flex;gap:8px;margin:0 0 16px}
.importrow input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:10px 14px;color:var(--ink);font:inherit;font-size:13px}
.importrow input:focus{outline:none;border-color:var(--accent)}
.importrow button{background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:10px 18px;font-weight:700;cursor:pointer}
.importrow button:disabled{opacity:.5;cursor:default}
.homelink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;padding:4px 10px;border:1px solid var(--line);border-radius:7px;background:none;cursor:pointer}
.hidden{display:none !important}
</style>
</head>
<body>
<div id="login" class="center hidden">
  <div class="logincard">
    <h2>Listing Review</h2>
    <p>Bicycle Addiction — sign in with your work email.</p>
    <input type="email" id="email" placeholder="you@example.com">
    <div class="decide">
      <button class="primary" id="btn-login">Send magic link</button>
      <span class="sub" id="login-msg"></span>
    </div>
    <input type="password" id="password" placeholder="password (if you have one set)" style="margin-top:8px">
    <div class="decide">
      <button id="btn-login-pw">Sign in with password</button>
    </div>
  </div>
</div>

<div id="picker" class="center hidden">
  <h2 style="margin:0 0 4px">Campaigns</h2>
  <p class="sub" style="margin:0 0 18px">Pick a review. <span id="whoami"></span> · <button class="homelink" id="btn-logout">Sign out</button> · <span id="home-conn"></span></p>
  <div class="importrow">
    <input id="imp-link" placeholder="Paste a Google Drive folder link to create a new campaign… (folder must be shared: Anyone with the link)">
    <button id="btn-import">⤓ Import</button>
    <button id="btn-sync-asins" title="Pull ASINs Amazon assigned to listings we created (runs hourly too)">↻ Sync ASINs</button>
    <span class="sub" id="sync-note"></span>
  </div>
  <div class="srchrow">
    <input id="camp-q" placeholder="Search campaigns and items — title, UPC, MPN, MSKU, ASIN, size, color…" autocomplete="off">
    <span class="sub" id="camp-q-note"></span>
  </div>
  <div id="itemhits"></div>
  <div id="camplist"></div>
</div>

<div id="console" class="hidden" style="display:flex;flex-direction:column;height:100%">
<header>
  <button class="homelink" id="btn-home">⌂ Campaigns</button>
  <div>
    <h1 id="hdr-title">Listing Review</h1>
    <div class="sub" id="hdr-sub"></div>
  </div>
  <div class="spacer"></div>
  <span class="count" id="c-total"></span>
  <span class="count acc" id="c-togo"></span>
  <span class="count warn" id="c-rev"></span>
  <span class="count acc" id="c-pend"></span>
  <span class="count bad" id="c-err"></span>
  <span class="count ok" id="c-live"></span>
  <span id="conn" class="sub"></span>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main><div class="wrap" id="view"></div></main>
</div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://kebzvmkumimhfixrkico.supabase.co';
// Amazon Cycling browse tree (keyword -> node -> accepted product types) - the
// same file the launcher validates against, so the console can show where a
// listing will land BEFORE anyone validates.
let BTG = null, BTGloading = false, BTGfailed = false;
async function loadBTG(){
  if (BTG || BTGloading || BTGfailed) return; BTGloading = true;
  let ok = false;
  try { BTG = await (await fetch(`${SUPABASE_URL}/storage/v1/object/public/review-app/meta/browse_nodes_cycling.json`)).json(); ok = !!(BTG && BTG.by_keyword); }
  catch(e){ ok = false; }
  BTGloading = false;
  if (!ok){ BTG = null; BTGfailed = true; return; }   // never re-render on failure - that loops
  if (camp && document.getElementById('view')) render();
}
const ANON_KEY = 'sb_publishable_hQniHzhNGLq07p6lULOOuA_bk1v-5fe';
const sb = createClient(SUPABASE_URL, ANON_KEY);

const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = v => v == null ? '—' : '$' + Number(v).toFixed(2);
const show = id => {
  for (const p of ['login','picker','console']) document.getElementById(p).classList.add('hidden');
  document.getElementById(id).classList.remove('hidden');
};

let session = null, email = null;

// Search index over every item in every campaign (title, MPN, UPC, MSKU,
// ASIN, variant sizes/colors) - loaded once in the background after the

// remember which campaign it landed in.
let ITEM_INDEX = null, ITEM_INDEX_LOADING = false;
async function loadItemIndex(){
  if (ITEM_INDEX || ITEM_INDEX_LOADING) return; ITEM_INDEX_LOADING = true;
  const { data } = await sb.from('review_campaigns').select('key,title,data');
  ITEM_INDEX = [];
  for (const c of data || []) for (const d of (c.data || [])) {
    const kids = (d.families?.[0]?.children || []).map(k => ({ size: k.size, color: k.color, upc: k.upc, sku: k.sku, mpn: k.mpn, asin: k.asin }));
    const ids = [d.mpn, d.upc, d.sku, d.asin, ...kids.flatMap(k => [k.upc, k.sku, k.mpn, k.asin])].filter(Boolean).map(String);
    const hay = [d.short_title, d.title, d.model_name, ...ids, ...kids.flatMap(k => [k.size, k.color])].filter(Boolean).join(' ').toLowerCase();
    ITEM_INDEX.push({ key: c.key, camp: c.title, id: d.id, title: d.short_title || d.title, ids: [...new Set(ids)].slice(0, 6), hay });
  }
  ITEM_INDEX_LOADING = false;

function applyOne(ev){
  if (ev.kind === 'revision' && ev.patch){
    const d = DATA.find(x => x.id === ev.item_id);
    if (!d) return;
    const p = ev.patch;
    if (p.title !== undefined) d.title = p.title;
    if (p.highlights !== undefined) d.highlights = p.highlights;
    if (p.description !== undefined) d.description = p.description;
    if (p.price !== undefined) d.price = p.price;
    if (p.keywords !== undefined && typeof p.keywords === 'string') d.keywords = [{kind:'backend_search_terms', content: p.keywords}];
    if (Array.isArray(p.bullets)){
      const tops = (d.bullets||[]).filter(b => !b.child_id && b.role !== 'reserved');
      p.bullets.forEach((t,i) => { if (typeof t === 'string' && tops[i]) tops[i].content = t; });
    }
    if (p.child_bullet !== undefined && ev.child_id){
      const cb = (d.bullets||[]).find(b => b.child_id === ev.child_id);
      if (cb) cb.content = p.child_bullet;
    }
    if (p.child_title !== undefined && ev.child_id){
      const fam = (d.families||[])[0];
      const c = fam?.children?.find(x => x.id === ev.child_id);
      if (c) { c.attrs = c.attrs || {}; c.attrs.child_title = p.child_title; }
    }
    if (Array.isArray(p.images)) d.images = p.images;
    if (Array.isArray(p.families)) d.families = p.families;
    if (Array.isArray(p.remove_variants) && p.remove_variants.length){
      d.bullets = (d.bullets||[]).filter(b => !b.child_id || !p.remove_variants.includes(b.child_id));
    }
    if (p.is_family !== undefined) d.is_family = !!p.is_family;
    if (typeof p.short_title === 'string') d.short_title = p.short_title;
    // AI merged sibling items into this one's variation family - drop them from the list
    if (Array.isArray(p.remove_items) && p.remove_items.length){
      const curId = DATA[cur]?.id;
      const keep = DATA.filter(x => !p.remove_items.includes(x.id));
      if (keep.length !== DATA.length){
        DATA.length = 0; DATA.push(...keep);
        const ni = DATA.findIndex(x => x.id === curId);
        cur = ni >= 0 ? ni : 0; childSel = 0;
      }
    }
  }
  if (ev.kind === 'upload' && ev.path){
    const d = DATA.find(x => x.id === ev.item_id);
    if (d && !d.images.includes(ev.path)) d.images.push(ev.path);
  }
}
function applyPatches(){ for (const ev of events) applyOne(ev); }
function flashIf(ev){
  if (ev.item_id === DATA[cur]?.id && (ev.kind === 'revision' || ev.kind === 'upload')){
    const m = document.querySelector('.mock');
    if (m){ m.classList.remove('flash'); void m.offsetWidth; m.classList.add('flash'); }
  }
}

function itemEvents(id){ return events.filter(e => e.item_id === id); }
function fieldsFor(id, childId){
  const f = {};
  for (const e of itemEvents(id)) if (e.kind === 'set_field' && e.patch){
    if (childId ? e.child_id === childId : !e.child_id) Object.assign(f, e.patch);
  }
  return f;
}
const RF = [['brand','Brand'],['manufacturer','Manufacturer'],['model_number','Model #'],
  ['model_name','Model Name'],['number_of_items','# Items'],['material','Material'],
  ['color','Color'],['size','Size'],['included_components','Included Components'],['warranty','Warranty']];
const RFOPT = [['pkg_length','Box L (in)'],['pkg_width','Box W (in)'],['pkg_height','Box H (in)'],['pkg_weight','Box Wt (lb)'],
  ['country_of_origin','Country (ISO)'],['amazon_product_type','PT override'],['tread_depth_mm','Tread depth (mm)']];
function itemStatus(id){
  let st = null;
  for (const e of itemEvents(id)){
    if (e.actor === 'user' && e.kind === 'revise') st = 'revising';
    if (e.actor === 'user' && e.kind === 'approve') st = 'validating';
    if (e.actor === 'user' && e.kind === 'skip') st = 'skipped';
    if (e.actor === 'user' && e.kind === 'unskip') st = null;
    if (e.actor === 'ai' && e.kind === 'revision') st = 'revised';
    if (e.actor === 'ai' && e.kind === 'chat' && st === 'revising') st = 'answered';
    if (e.actor === 'ai' && e.kind === 'status') st = e.status;
  }
  return st;
}

  answered:'AI replied — see thread',

function flagsFor(d){
  const f = [];
  if (d.map_missing) f.push(['warn','MAP missing — MSRP used as List Price, needs confirmation']);
  if (/lithium|battery/i.test(d.notes||'')) f.push(['bad','Li-ion battery — Dangerous Goods fields must NOT default to N/A']);
  if (!(d.images||[]).length) f.push(['bad','No product imagery — Amazon requires a main image']);
  if (d.asin) f.push(['ok', (d.amazon_status === 'existing' ? 'Existing ASIN · ' : 'Live on Amazon · ') + d.asin]);
  else f.push(['info','Not yet on Amazon']);
  if (d.is_family) f.push(['info','Variant family']);
  return f;
}
function kidsFor(d){
  // Effective variants: a size/color override set on the variant (chat or the
  // fields panel) IS its name - the launcher sends the override, so the chips
  // must show it too, not the raw imported record.
  const kids = (d.families?.[0]?.children || []).map(k => {
    const f = fieldsFor(d.id, k.id);
    const size = (f.size ?? k.size), color = (f.color ?? k.color);
    return (size === k.size && color === k.color) ? k : { ...k, size, color };
  });
  const key = k => k.size || k.color || k.sku || '';
  return kids.sort((a,b) => {
    const na = parseFloat(key(a)), nb = parseFloat(key(b));
    if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
    return key(a).localeCompare(key(b), undefined, {numeric:true});
  });
}
function currentChild(d){
  if (childSel < 0) return null; // parent view
  const kids = kidsFor(d);
  return kids.length ? kids[Math.min(childSel, kids.length-1)] : null;
}
function imagesFor(d){
  const kid = currentChild(d);
  const kimgs = kid?.attrs?.images || [];
  return kimgs.length ? kimgs : (d.images || []);
}
function bulletsFor(d){
  // Returns the actual bullet objects (not just .content strings) so callers
  // can tell a child-specific bullet from a shared one (via .child_id) and
  // edit it in place.
  const shared = (d.bullets||[]).filter(b => !b.child_id && b.role !== 'reserved');
  const kid = currentChild(d);
  if (!kid) return shared;
  const kidBul = (d.bullets||[]).filter(b => b.child_id && b.child_id === kid.id);
  return [...kidBul, ...shared.filter(b=>b.scope==='parent_shared')];
}
function threadHTML(d){

    (e.actor==='user' && ['chat','approve','revise','upload','skip','unskip','confirm_live','set_field'].includes(e.kind)) ||

  if (!evs.length) return '<div class="sub">No activity yet.</div>';
  return '<div class="thread">' + evs.map(e => {
    if (e.actor==='user'){
      const who = e.actor_email ? e.actor_email.split('@')[0] : 'You';
      if (e.kind==='skip') return `<div class="msg sys">— ⏸ Skipped by ${esc(who)}${e.text?': '+esc(e.text):''} —</div>`;
      if (e.kind==='unskip') return `<div class="msg sys">— ▶ Resumed by ${esc(who)} —</div>`;
      if (e.kind==='upload') return `<div class="msg user"><div class="who">${esc(who)}</div>📷 Uploaded a photo</div>`;
      if (e.kind==='confirm_live') return `<div class="msg sys">— 🚀 Live push confirmed by ${esc(who)} —</div>`;
      if (e.kind==='set_field') return `<div class="msg sys">— ⚙ ${esc(who)} set ${esc(Object.keys(e.patch||{}).map(k=>k==='prop65'?('Prop 65 '+((e.patch||{}).prop65?'ON':'OFF')):k.replace(/_/g,' ')).join(', '))} —</div>`;
      if (e.kind==='revise' && e.patch && e.patch.override){
        return `<div class="msg user ovr"><div class="who">${esc(who)} · ⚠ override</div>${esc(e.text||'')}<div class="ovrtag">Reason: ${esc(e.patch.override.reason||'')} · recorded ${esc(String(e.ts||'').slice(0,10))}</div></div>`;
      }
      const label = e.kind==='approve' ? '✔ Approved for launch' + (e.text?': ':'') : e.kind==='revise' ? '✎ Change request: ' : '';
      return `<div class="msg user"><div class="who">${esc(who)}</div>${esc(label)}${esc(e.text||'')}</div>`;
    }
    if (e.kind==='status' && !e.text) return `<div class="msg sys">— ${esc(ST_LABEL[e.status]||e.status)} —</div>`;
    if (e.kind==='chat' && e.patch && e.patch.ask){
      // Structured reviewer decision from the launcher: numbered buttons; the
      // plain text keeps the numbers so "1" typed in chat means the same thing.
      const a = e.patch.ask;
      return `<div class="msg ask"><div class="who">❓ Decision needed</div><b>${esc(a.title||'')}</b>` +
        (a.options||[]).map((o,i) => `<button class="askopt" data-ev="${esc(String(e.id))}" data-i="${i}">${i+1}. ${esc(o.label||'')}</button>`).join('') +
        `<div class="sub">Click an option, or reply with its number in the chat.</div></div>`;
    }
    return `<div class="msg ai"><div class="who">AI</div>${esc(e.text||'')}</div>`;
  }).join('') + '</div>';
}

  if (ttlOk) ttlOk.onclick = commitTitle;
  const ttlX = document.querySelector('.ttlx');
  if (ttlX) ttlX.onclick = () => { titleEdit = false; render(); };
  const ttlIn = document.getElementById('ttl-in');
  if (ttlIn) ttlIn.onkeydown = e => {
    if (e.key === 'Enter') commitTitle();
    if (e.key === 'Escape'){ titleEdit = false; render(); }
  };
  document.querySelectorAll('.bltedit').forEach(b => b.onclick = () => {
    bulletEdit = +b.dataset.bi; render();
    const el = document.getElementById('blt-in'); if (el){ el.focus(); el.select(); }
  });
  const bltOk = document.querySelector('.bltok');
  if (bltOk) bltOk.onclick = commitBullet;
  const bltX = document.querySelector('.bltx');
  if (bltX) bltX.onclick = () => { bulletEdit = -1; render(); };
  const bltIn = document.getElementById('blt-in');
  if (bltIn) bltIn.onkeydown = e => {
    if (e.key === 'Enter') commitBullet();
    if (e.key === 'Escape'){ bulletEdit = -1; render(); }
  };
  const th = document.querySelector('.thread');
  if (th){ th.dataset.item = d.id; th.scrollTop = stick ? th.scrollHeight : oldPos; }
  renderNav();
}
function commitRf(){
  if (!rfEdit) return;
  const k = rfEdit;
  let val = k === 'prop65'
    ? (document.getElementById('rf-in-p65')?.checked ?? false)
    : (document.getElementById('rf-in')?.value ?? '').trim();
  // Category keyword: lowercase, and tolerate a pasted "keyword — path" label.
  if (k === 'item_type_keyword') val = String(val).split(' — ')[0].trim().toLowerCase();
  if (k === 'amazon_product_type') val = String(val).trim().toUpperCase();
  if (k === 'country_of_origin') val = String(val).trim().toUpperCase();
  rfEdit = null;
  // Category / product type / country are item-level facts, never per-variant.
  const itemLevel = ['item_type_keyword','amazon_product_type','country_of_origin'].includes(k);
  insertEvent('set_field', itemLevel ? { patch: { [k]: val }, child_id: null } : { patch: { [k]: val } });
}
function commitTitle(){
  const val = (document.getElementById('ttl-in')?.value ?? '').trim();
  titleEdit = false;
  const d = DATA[cur];
  if (!val || !d) { render(); return; }
  const kid = currentChild(d);
  if (kid){
    const cur2 = kid.attrs?.child_title || d.title || d.short_title;
    if (val === cur2) { render(); return; }
    kid.attrs = kid.attrs || {}; kid.attrs.child_title = val;
    edit({ child_title: val }, kid.id);
  } else {
    if (val === d.title) { render(); return; }
    d.title = val;
    edit({ title: val });
  }
}
function commitDesc(){
  const val = (document.getElementById('desc-in')?.value ?? '').trim();
  descEdit = false;
  const d = DATA[cur];
  if (!d || !val || val === (d.description||'')) { render(); return; }
  d.description = val;
  edit({ description: val });
}
function commitBullet(){
  if (bulletEdit < 0) return;
  const i = bulletEdit;
  const val = (document.getElementById('blt-in')?.value ?? '').trim();
  bulletEdit = -1;
  const d = DATA[cur];
  if (!d) { render(); return; }
  const bo = bulletsFor(d)[i];
  if (!val || !bo || val === bo.content) { render(); return; }
  bo.content = val;
  if (bo.child_id){
    edit({ child_bullet: val }, bo.child_id);
  } else {
    const tops = (d.bullets||[]).filter(b => !b.child_id && b.role !== 'reserved');
    edit({ bullets: tops.map(b => b.content) });
  }
}
function bind(id, fn){ const el = document.getElementById(id); if (el) el.onclick = fn; }
function clearDrafts(){ for (const id of ['note','chat']){ const el = document.getElementById(id); if (el) el.value = ''; } }
function go(i){ if (i<0 || i>=DATA.length) return; cur = i; imgSel = 0; childSel = 0; rfEdit = null; titleEdit = false; bulletEdit = -1; descEdit = false; clearDrafts(); render();
  document.querySelector('#console main').scrollTop = 0; }

// ---------- actions ----------
async function insertEvent(kind, extra = {}){
  const row = { campaign: camp.key, item_id: DATA[cur].id, kind, actor: 'user', actor_email: email,
    child_id: currentChild(DATA[cur])?.id ?? null, ...extra };
  const { data, error } = await sb.from('review_events').insert(row).select('id').single();
  if (error) { alert('Could not save: ' + error.message); return null; }
  events.push({ ...row, id: data.id, actor: 'user', ts: new Date().toISOString() });
  render();
  return data.id;
}
async function callFnJson(name, body){
  const res = await fetch(`${SUPABASE_URL}/functions/v1/${name}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token, 'apikey': ANON_KEY },
    body: JSON.stringify(body),
  });
  try { return await res.json(); } catch { return { ok: false, error: 'HTTP ' + res.status }; }
}
// Direct edits (title, bullets, description, gallery) go through the launcher's
// `edit` action: it applies the change to the campaign data and records the
// revision event - the console itself may not insert revision rows (RLS).
async function edit(patch, child_id = null){
  const d = DATA[cur]; if (!d) return;
  const res = await callFnJson('review-launch', { action: 'edit', campaign: camp.key, item_id: d.id, child_id, patch });
  if (!res?.ok){ alert('Could not save: ' + (res?.error || 'unknown error')); render(); return; }
  const ev = { id: res.event_id, campaign: camp.key, item_id: d.id, kind: 'revision', actor: 'user', actor_email: email,
    child_id, patch: res.patch, ts: new Date().toISOString() };
  if (!events.some(e => e.id === ev.id)) { events.push(ev); applyOne(ev); }
  render();
}
async function callFn(name, body){
  const res = await fetch(`${SUPABASE_URL}/functions/v1/${name}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token, 'apikey': ANON_KEY },
    body: JSON.stringify(body),
  });
  if (!res.ok && res.status !== 500) console.warn(name, res.status, await res.text());
}
// Decision-box buttons: a chat option becomes a change request the AI acts
// on; an action option runs the matching console command (e.g. skip).
document.addEventListener('click', async ev => {
  const b = ev.target.closest('.askopt'); if (!b) return;
  const src = events.find(x => String(x.id) === b.dataset.ev);
  const o = src?.patch?.ask?.options?.[+b.dataset.i]; if (!o) return;
  if (o.act === 'skip') return doSkip();
  const id = await insertEvent('revise', { text: o.say || o.label });
  if (id) callFn('review-ai', { event_id: id });
});
document.addEventListener('change', e => { if (e.target && e.target.id === 'ovr-ck') render(); });
async function doRevise(){
  const note = document.getElementById('note').value.trim();
  if (!note){ document.getElementById('note').focus(); return; }
  // Override: strict rules stay on for the AI; the exception is an explicit,
  // recorded act - reviewer name + reason ride the revise event (audit trail)
  // and the claim is filed as a reviewer-attested fact on the item.
  const ovr = document.getElementById('ovr-ck')?.checked ?? false;
  const reason = (document.getElementById('ovr-reason')?.value || '').trim();
  if (ovr && !reason){ document.getElementById('ovr-reason')?.focus(); return; }
  document.getElementById('note').value = '';
  if (ovr) document.getElementById('ovr-ck').checked = false;
  const id = await insertEvent('revise', { text: note, ...(ovr ? { patch: { override: { reason } } } : {}) });
  if (id) callFn('review-ai', { event_id: id });
}
async function doChat(){
  const el = document.getElementById('chat');
  const t = el.value.trim();
  if (!t) return;
  el.value = '';
  const id = await insertEvent('chat', { text: t });
  if (id) callFn('review-ai', { event_id: id });
}
async function doApprove(){
  const note = document.getElementById('note').value.trim();
  document.getElementById('note').value = '';
  const id = await insertEvent('approve', { text: note || null });
  if (id) callFn('review-launch', { action: 'validate', campaign: camp.key, item_id: DATA[cur].id }).then(refreshData);
}
// Re-pull campaign data after validation so launcher-written fields
// (resolved browse node / category) show up without reopening the campaign.
async function refreshData(){
  try {
    const { data: full } = await sb.from('review_campaigns').select('data').eq('key', camp.key).single();
    if (full?.data) { DATA = full.data; applyPatches(); render(); }
  } catch (e) { console.warn('refreshData', e); }
}
async function doLive(){
  const d = DATA[cur];
  if (!confirm(`Push this listing LIVE to Amazon?\n\n${d.title || d.short_title}\nSKU ${d.upc}${d.asin ? ' · ASIN ' + d.asin : ''}\n\nThis updates the real product page.`)) return;
  const id = await insertEvent('confirm_live');
  if (id) callFn('review-launch', { action: 'live', confirm: true, campaign: camp.key, item_id: d.id });
}
async function doVerify(){
  const b = document.getElementById('btn-verify');
  if (b){ b.disabled = true; b.textContent = '🔍 Verifying…'; }
  await callFn('review-launch', { action: 'verify', campaign: camp.key, item_id: DATA[cur].id });
}
async function doSkip(){
  const skipped = itemStatus(DATA[cur].id) === 'skipped';
  const note = document.getElementById('note').value.trim();
  document.getElementById('note').value = '';
  await insertEvent(skipped ? 'unskip' : 'skip', { text: note || null });
  if (!skipped && cur+1 < DATA.length) go(cur+1);
}
async function doUpload(files){
  const d = DATA[cur];
  const kid = currentChild(d);
  const stat = document.getElementById('upl-status') || document.getElementById('upl2-status');
  const added = [];
  for (const f of files){
    if (stat) stat.textContent = `uploading ${f.name}…`;
    const path = `uploads/${d.id}/${Date.now()}_${f.name.replace(/[^A-Za-z0-9._-]/g,'_')}`;
    const { error } = await sb.storage.from('product-images').upload(path, f);
    if (error){ if (stat) stat.textContent = 'upload failed: ' + error.message; return; }
    added.push(`${SUPABASE_URL}/storage/v1/object/public/product-images/${path}`);
  }
  if (stat) stat.textContent = '';
  if (!added.length) return;
  // Appended to the selected variant's gallery (or the item's), max 9 - saved
  // through the launcher's edit action so it reaches Amazon on the next push.
  const list = [...imagesFor(d).filter(u => !added.includes(u)), ...added].slice(0, 9);
  imgSel = Math.max(0, Math.min(8, list.length - added.length));
  await edit({ images: list }, kid ? kid.id : null);
}
